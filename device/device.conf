# 冷库数据监控系统 - 设备端配置
# 格式：key=value，# 开头或空行为注释
# 注：node_id 命名规范 cold<NN>_<front|back>

# 网关（TCP 服务端）地址与端口
gateway_ip=127.0.0.1
gateway_port=18830

# 节点标识与显示名称
node_id=cold01_front
name=1号冷库-前门

# 数据上报周期（秒，1~600）
interval=5

# 本地报警阈值（℃）：temperature > 该值时 alarm=1
alarm_threshold=-15

# 模拟模式开关：1=模拟（随机游走+打印日志），0=真实硬件（sysfs GPIO）
sim_mode=1

# 真实模式：LED / 蜂鸣器 GPIO 编号（模拟模式忽略；-1 表示不使用）
led_gpio=17
beeper_gpio=18

# 真实模式：温湿度 sysfs 文件路径（模拟模式忽略；留空则退化为模拟）
sensor_temp_path=/sys/class/hwmon/hwmon0/temp1_input
sensor_humi_path=/sys/class/hwmon/hwmon0/humidity1_input
